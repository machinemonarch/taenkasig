---
# Container should not run as root but instead with the privileges of a dedicated service user.
- name: Create a (non-root) container service user.
  ansible.builtin.user:
    name: "{{ podman_user }}"
    system: true
    create_home: true
    shell: /sbin/nologin
  register: service_user_account

# Allow for the running of unprivileged containers and provides secure handling of user namespace.
- name: Allocate subordinate UID range for the container user.
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "{{ podman_user }}:200000:65536"
    regexp: "^{{ podman_user }}:"

# Allow for the running of unprivileged containers and provides secure handling of group namespace.
- name: Allocate subordinate GID range for the container user.
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "{{ podman_user }}:200000:65536"
    regexp: "^{{ podman_user }}:"

# Allows {{ podman_user }} long-running services without the service user being logged in.
# Necessary for a non-interactive (headless) service.
- name: Enable lingering for the container service user.
  ansible.builtin.command: "loginctl enable-linger {{ podman_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ podman_user }}"
